<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Split Bill">
    <meta name="theme-color" content="#9333ea">
    <title>Split Bill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <style>
        * {
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, button {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // Icons as SVG components
        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Download = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const MessageCircle = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        );

        const Camera = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
        );

        const Edit2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
        );

        const SplitBillApp = () => {
            const [currency, setCurrency] = useState('IDR');
            const [currencySymbol, setCurrencySymbol] = useState('Rp');
            const [items, setItems] = useState([]);
            const [people, setPeople] = useState([]);
            const [newPerson, setNewPerson] = useState('');
            const [taxPercent, setTaxPercent] = useState(0);
            const [servicePercent, setServicePercent] = useState(0);
            const [bearer, setBearer] = useState('');
            const [showCalculation, setShowCalculation] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', price: '', assignedTo: [] });
            const [ocrLoading, setOcrLoading] = useState(false);
            const fileInputRef = useRef(null);
            const resultRef = useRef(null);

            const handleOCR = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setOcrLoading(true);

                try {
                    const result = await Tesseract.recognize(file, 'eng', {
                        logger: () => {},
                    });

                    const text = result.data.text;
                    const lines = text.split('\n');
                    const pricePattern = /[\d,\.]+(?:\s*(?:k|K))?\s*$/;

                    lines.forEach((line) => {
                        line = line.trim();
                        if (line.length < 3) return;

                        const match = line.match(pricePattern);
                        if (match) {
                            let itemName = line.replace(match[0], '').trim();
                            let price = match[0].trim();

                            price = price.replace(/[k|K]/g, '000').replace(/[.,]/g, '');
                            const priceNum = parseInt(price);

                            if (itemName && !isNaN(priceNum) && priceNum > 0) {
                                setItems(prev => [...prev, {
                                    id: Date.now() + Math.random(),
                                    name: itemName,
                                    price: priceNum,
                                    assignedTo: []
                                }]);
                            }
                        }
                    });

                    alert('✨ Receipt scanned! Review & assign to people');
                } catch (error) {
                    alert('OCR failed - try manual entry or clearer photo');
                }
                setOcrLoading(false);
            };

            const addPerson = () => {
                if (newPerson.trim() && !people.includes(newPerson.trim())) {
                    setPeople([...people, newPerson.trim()]);
                    setNewPerson('');
                }
            };

            const addItem = () => {
                if (newItem.name && newItem.price && newItem.assignedTo.length > 0) {
                    setItems([...items, {
                        id: Date.now(),
                        name: newItem.name,
                        price: parseFloat(newItem.price),
                        assignedTo: newItem.assignedTo
                    }]);
                    setNewItem({ name: '', price: '', assignedTo: [] });
                }
            };

            const togglePersonAssignment = (itemId, person) => {
                setItems(items.map(item => {
                    if (item.id === itemId) {
                        const isAssigned = item.assignedTo.includes(person);
                        return {
                            ...item,
                            assignedTo: isAssigned
                                ? item.assignedTo.filter(p => p !== person)
                                : [...item.assignedTo, person]
                        };
                    }
                    return item;
                }));
            };

            const deleteItem = (itemId) => {
                setItems(items.filter(item => item.id !== itemId));
            };

            const calculateSettlement = () => {
                if (!bearer || items.length === 0) {
                    alert('Select bearer & add items');
                    return null;
                }

                const personTotals = {};
                const personOrders = {};

                people.forEach(person => {
                    personTotals[person] = 0;
                    personOrders[person] = [];
                });

                items.forEach(item => {
                    if (item.assignedTo.length > 0) {
                        const costPerPerson = item.price / item.assignedTo.length;
                        item.assignedTo.forEach(person => {
                            personTotals[person] += costPerPerson;
                            personOrders[person].push(`${item.name}`);
                        });
                    }
                });

                const subtotal = Object.values(personTotals).reduce((a, b) => a + b, 0);
                const taxAmount = (subtotal * taxPercent) / 100;
                const serviceAmount = (subtotal * servicePercent) / 100;

                Object.keys(personTotals).forEach(person => {
                    const proportion = subtotal > 0 ? personTotals[person] / subtotal : 0;
                    personTotals[person] += taxAmount * proportion + serviceAmount * proportion;
                });

                const settlement = [];
                Object.keys(personTotals).forEach(person => {
                    if (person !== bearer && personTotals[person] > 0) {
                        settlement.push({
                            from: person,
                            to: bearer,
                            amount: personTotals[person]
                        });
                    }
                });

                return { personTotals, personOrders, settlement, subtotal, taxAmount, serviceAmount };
            };

            const formatCurrency = (amount) => {
                if (currency === 'IDR') {
                    return `Rp${Math.round(amount).toLocaleString('id-ID')}`;
                }
                return `${currencySymbol}${amount.toFixed(2)}`;
            };

            const downloadScreenshot = async () => {
                try {
                    const element = resultRef.current;
                    const canvas = await html2canvas(element, {
                        backgroundColor: '#ffffff',
                        scale: 2,
                    });
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL();
                    link.download = 'split-bill.png';
                    link.click();
                } catch {
                    // Fallback: just use native screenshot
                    alert('Use native screenshot: hold power + volume up 📱');
                }
            };

            const shareToWhatsApp = () => {
                const result = calculateSettlement();
                if (!result) return;

                let message = `📱 *SPLIT BILL*\n\n`;

                people.forEach(person => {
                    message += `*${person.toUpperCase()}*\n`;
                    message += `Order: ${result.personOrders[person].join(', ') || 'nothing'}\n`;
                    message += `Total: ${formatCurrency(result.personTotals[person])}\n\n`;
                });

                message += `---\n*SETTLEMENT*\n`;
                result.settlement.forEach(s => {
                    message += `${s.from} owes ${s.to}: ${formatCurrency(s.amount)}\n`;
                });

                const encodedMessage = encodeURIComponent(message);
                window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
            };

            const handleEditCurrency = () => {
                const newCurr = prompt('Enter currency (e.g., IDR, USD, SGD, PHP):', currency);
                if (newCurr) {
                    setCurrency(newCurr);
                    const symbols = { IDR: 'Rp', USD: '$', SGD: 'S$', PHP: '₱', THB: '฿' };
                    setCurrencySymbol(symbols[newCurr] || newCurr);
                }
            };

            const result = showCalculation ? calculateSettlement() : null;

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 p-4 pb-20">
                    <div className="max-w-lg mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8 pt-4">
                            <h1 className="text-4xl font-bold bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 bg-clip-text text-transparent mb-2">
                                Split Bill
                            </h1>
                            <p className="text-gray-600 text-sm">who ordered what? 🍽️</p>
                        </div>

                        {!showCalculation ? (
                            <div className="space-y-6">
                                {/* Currency Selector */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <div className="flex justify-between items-center">
                                        <span className="text-gray-700 font-semibold">Currency</span>
                                        <button
                                            onClick={handleEditCurrency}
                                            className="px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-lg text-sm font-medium hover:shadow-md transition"
                                        >
                                            {currency}
                                        </button>
                                    </div>
                                </div>

                                {/* People Input */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <h2 className="font-bold text-gray-900 mb-3">👥 Who's here?</h2>
                                    <div className="flex gap-2 mb-3">
                                        <input
                                            type="text"
                                            value={newPerson}
                                            onChange={(e) => setNewPerson(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && addPerson()}
                                            placeholder="name..."
                                            className="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                                        />
                                        <button
                                            onClick={addPerson}
                                            className="px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-lg hover:shadow-md transition"
                                        >
                                            <Plus size={20} />
                                        </button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {people.map(person => (
                                            <div
                                                key={person}
                                                className="px-3 py-1 bg-gradient-to-r from-purple-100 to-pink-100 text-purple-900 rounded-full text-sm font-medium flex items-center gap-2"
                                            >
                                                {person}
                                                <button
                                                    onClick={() => setPeople(people.filter(p => p !== person))}
                                                    className="hover:text-purple-600"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* OCR Input */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <button
                                        onClick={() => fileInputRef.current?.click()}
                                        disabled={ocrLoading}
                                        className="w-full py-3 bg-gradient-to-r from-blue-500 to-cyan-500 text-white rounded-lg font-medium hover:shadow-md transition disabled:opacity-50"
                                    >
                                        <span className="inline-block mr-2"><Camera size={20} /></span>
                                        {ocrLoading ? 'Scanning...' : 'Snap Receipt'}
                                    </button>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept="image/*"
                                        onChange={handleOCR}
                                        className="hidden"
                                    />
                                </div>

                                {/* Manual Entry */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <h2 className="font-bold text-gray-900 mb-3">🍽️ Items</h2>
                                    <div className="space-y-3 mb-4">
                                        <input
                                            type="text"
                                            value={newItem.name}
                                            onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                                            placeholder="item name..."
                                            className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                                        />
                                        <input
                                            type="number"
                                            value={newItem.price}
                                            onChange={(e) => setNewItem({ ...newItem, price: e.target.value })}
                                            placeholder="price..."
                                            className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                                        />
                                        <div className="space-y-2">
                                            <p className="text-xs font-semibold text-gray-600">Assign to:</p>
                                            <div className="flex flex-wrap gap-2">
                                                {people.map(person => (
                                                    <button
                                                        key={person}
                                                        onClick={() => togglePersonAssignment('new', person)}
                                                        className={`px-3 py-1 rounded-lg text-sm font-medium transition ${
                                                            newItem.assignedTo.includes(person)
                                                                ? 'bg-purple-500 text-white'
                                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        }`}
                                                    >
                                                        {person}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <button
                                            onClick={addItem}
                                            className="w-full py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-lg font-medium hover:shadow-md transition"
                                        >
                                            Add Item
                                        </button>
                                    </div>

                                    {/* Items List */}
                                    <div className="space-y-2">
                                        {items.map(item => (
                                            <div key={item.id} className="bg-gray-50 p-3 rounded-lg text-sm">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <p className="font-semibold text-gray-900">{item.name}</p>
                                                        <p className="text-gray-600">{formatCurrency(item.price)}</p>
                                                    </div>
                                                    <button
                                                        onClick={() => deleteItem(item.id)}
                                                        className="text-red-500 hover:text-red-700"
                                                    >
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                                <div className="flex flex-wrap gap-1">
                                                    {item.assignedTo.map(person => (
                                                        <span key={person} className="px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded">
                                                            {person}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Tax & Service */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <h2 className="font-bold text-gray-900 mb-3">💰 Tax & Service</h2>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="text-xs font-semibold text-gray-600">Tax %</label>
                                            <input
                                                type="number"
                                                value={taxPercent}
                                                onChange={(e) => setTaxPercent(parseFloat(e.target.value) || 0)}
                                                className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-gray-600">Service %</label>
                                            <input
                                                type="number"
                                                value={servicePercent}
                                                onChange={(e) => setServicePercent(parseFloat(e.target.value) || 0)}
                                                className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Bearer Selection */}
                                <div className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm">
                                    <h2 className="font-bold text-gray-900 mb-3">💳 Who paid?</h2>
                                    <div className="flex flex-wrap gap-2">
                                        {people.map(person => (
                                            <button
                                                key={person}
                                                onClick={() => setBearer(person)}
                                                className={`px-4 py-2 rounded-lg font-medium transition ${
                                                    bearer === person
                                                        ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white'
                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                }`}
                                            >
                                                {person}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Calculate Button */}
                                <button
                                    onClick={() => {
                                        const result = calculateSettlement();
                                        if (result) setShowCalculation(true);
                                    }}
                                    className="w-full py-4 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 text-white rounded-2xl font-bold text-lg hover:shadow-lg transition"
                                >
                                    💸 Calculate
                                </button>
                            </div>
                        ) : (
                            // Results View
                            <div ref={resultRef} className="bg-white/95 backdrop-blur rounded-2xl p-6 shadow-lg mb-6">
                                <div className="text-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-900">📋 Bill Summary</h2>
                                </div>

                                {/* People Orders */}
                                <div className="space-y-4 mb-8 pb-8 border-b border-gray-200">
                                    {people.map(person => (
                                        <div key={person} className="bg-gradient-to-r from-purple-50 to-pink-50 p-4 rounded-lg">
                                            <p className="font-bold text-lg text-gray-900 mb-2">{person.toUpperCase()}</p>
                                            <p className="text-sm text-gray-700 mb-2">
                                                Order: {result.personOrders[person].length > 0 ? result.personOrders[person].join(', ') : 'nothing'}
                                            </p>
                                            <p className="text-lg font-bold text-purple-600">
                                                {formatCurrency(result.personTotals[person])}
                                            </p>
                                        </div>
                                    ))}
                                </div>

                                {/* Settlement */}
                                <div className="bg-gradient-to-r from-green-50 to-emerald-50 p-4 rounded-lg mb-8">
                                    <h3 className="font-bold text-gray-900 mb-3">✅ SETTLEMENT</h3>
                                    <div className="space-y-2">
                                        {result.settlement.map((s, idx) => (
                                            <p key={idx} className="text-gray-900">
                                                <span className="font-semibold">{s.from}</span> owes <span className="font-semibold">{s.to}</span>: <span className="font-bold text-green-600">{formatCurrency(s.amount)}</span>
                                            </p>
                                        ))}
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="space-y-3">
                                    <button
                                        onClick={() => setShowCalculation(false)}
                                        className="w-full py-3 bg-gray-200 text-gray-900 rounded-lg font-semibold hover:bg-gray-300 transition flex items-center justify-center gap-2"
                                    >
                                        <span><Edit2 size={20} /></span>
                                        Edit
                                    </button>
                                    <button
                                        onClick={() => {
                                            alert('📱 Native screenshot ready! Use: hold power + volume up');
                                            setTimeout(() => window.print(), 100);
                                        }}
                                        className="w-full py-3 bg-gradient-to-r from-blue-500 to-cyan-500 text-white rounded-lg font-semibold hover:shadow-md transition flex items-center justify-center gap-2"
                                    >
                                        <span><Download size={20} /></span>
                                        Save to Gallery
                                    </button>
                                    <button
                                        onClick={shareToWhatsApp}
                                        className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-lg font-semibold hover:shadow-md transition flex items-center justify-center gap-2"
                                    >
                                        <span><MessageCircle size={20} /></span>
                                        Share to WhatsApp
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<SplitBillApp />);
    </script>
</body>
</html>
