<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Split Bill">
    <meta name="theme-color" content="#9333ea">
    <title>Split Bill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #faf5ff 0%, #fce7f3 50%, #eff6ff 100%);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 28rem;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            margin-top: 1rem;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #9333ea, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #4b5563;
            font-size: 0.875rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            font-weight: 700;
            color: #111;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .step-badge.incomplete {
            background: #e5e7eb;
            color: #6b7280;
        }

        .step-badge.complete {
            background: #10b981;
            color: white;
        }

        input, select, button {
            font-family: inherit;
            border: 1px solid #e5e7eb;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.1);
        }

        input:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .input-group input {
            flex: 1;
        }

        .input-group button {
            padding: 0.5rem 1rem;
        }

        .btn {
            background: linear-gradient(to right, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .btn:hover {
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-blue {
            background: linear-gradient(to right, #3b82f6, #06b6d4);
        }

        .btn-green {
            background: linear-gradient(to right, #10b981, #059669);
        }

        .btn-secondary {
            background: #d1d5db;
            color: #111;
        }

        .btn-secondary:hover {
            background: #9ca3af;
        }

        .btn-small {
            padding: 0.35rem 0.6rem;
            font-size: 0.75rem;
        }

        .btn-full {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .pill {
            background: linear-gradient(to right, #e9d5ff, #fbcfe8);
            color: #6b21a8;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pill button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
        }

        .item-box {
            background: #f3f4f6;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }

        .item-name {
            font-weight: 600;
            color: #111;
        }

        .item-price {
            color: #666;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0;
            font-weight: 600;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 0.875rem;
            padding: 0;
        }

        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .item-tag {
            background: #e9d5ff;
            color: #6b21a8;
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
        }

        .hidden {
            display: none !important;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 1rem 1rem 0 0;
            padding: 1.5rem;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .toggle-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toggle-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #e5e7eb;
            background: #f3f4f6;
            color: #4b5563;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toggle-btn.active {
            background: linear-gradient(to right, #a855f7, #ec4899);
            color: white;
            border-color: #a855f7;
        }

        .toggle-btn:hover {
            background: #e5e7eb;
        }

        .label-small {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.05), rgba(236, 72, 153, 0.05));
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }

        .result-person-name {
            font-weight: 700;
            font-size: 1.125rem;
            color: #111;
            margin-bottom: 0.5rem;
        }

        .result-order {
            font-size: 0.875rem;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .result-total {
            font-size: 1.125rem;
            font-weight: 700;
            color: #a855f7;
        }

        .settlement-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), rgba(5, 150, 105, 0.05));
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .settlement-title {
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #111;
        }

        .settlement-item {
            color: #1f2937;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ocr-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-left: 4px solid;
        }

        .ocr-status.pending {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(6, 182, 212, 0.1));
            color: #1e40af;
            border-color: #3b82f6;
        }

        .ocr-status.success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            color: #065f46;
            border-color: #10b981;
        }

        .ocr-status.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
            color: #7f1d1d;
            border-color: #ef4444;
        }

        .disabled-field {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Split Bill</h1>
            <p>who ordered what? 🍽️</p>
            <button class="btn btn-secondary" style="margin-top: 1rem; padding: 0.35rem 0.75rem; font-size: 0.75rem;" id="resetKeyBtn" onclick="resetApiKey()" style="display: none;">Reset API Key</button>
        </div>

        <!-- Setup View -->
        <div id="setupView" class="hidden">
            <div class="card">
                <h2>🔑 Set Up API Key</h2>
                <p style="color: #4b5563; font-size: 0.9rem; margin-bottom: 1rem;">Enter your Claude API key to use receipt scanning</p>
                <div style="background: #fef3c7; border: 1px solid #f59e0b; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; color: #92400e;">
                    💡 Get your API key from <a href="https://console.anthropic.com" target="_blank" style="color: #b45309; text-decoration: underline;">console.anthropic.com</a>
                </div>
                <div class="input-group" style="margin-bottom: 0;">
                    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
                    <button class="btn" onclick="setApiKey()">Save</button>
                </div>
            </div>
        </div>

        <!-- Main Input View -->
        <div id="inputView" class="hidden">
            <!-- Step 1: People -->
            <div class="card">
                <div class="step-indicator">
                    <span class="step-badge" id="step1Badge">1</span>
                    <span>Add People</span>
                </div>
                <div class="input-group">
                    <input type="text" id="newPersonInput" placeholder="name..." />
                    <button class="btn" onclick="addPerson()">+</button>
                </div>
                <div class="pills" id="peopleList"></div>
            </div>

            <!-- Step 2: Items -->
            <div class="card" id="itemsCard">
                <div class="step-indicator">
                    <span class="step-badge" id="step2Badge">2</span>
                    <span>Add Items</span>
                </div>
                
                <!-- OCR Button -->
                <button class="btn btn-blue btn-full" onclick="document.getElementById('fileInput').click()" id="ocrButton">
                    📷 Scan Receipt
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleVisionOCR(event)" />
                <div id="ocrStatus" class="hidden ocr-status"></div>

                <!-- Manual Entry -->
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
                    <p style="font-size: 0.85rem; color: #4b5563; margin-bottom: 0.75rem;">Or add manually:</p>
                    <input type="text" id="itemName" placeholder="item name..." style="width: 100%; margin-bottom: 0.5rem;" />
                    <input type="number" id="itemPrice" placeholder="price..." style="width: 100%; margin-bottom: 0.5rem;" />
                    
                    <div style="margin-bottom: 1rem;">
                        <span class="label-small">Assign to:</span>
                        <div class="toggle-buttons" id="assignButtons"></div>
                    </div>

                    <button class="btn btn-full" onclick="addItem()">Add Item</button>
                </div>

                <!-- Items List -->
                <div id="itemsList" style="margin-top: 1rem;"></div>
            </div>

            <!-- Step 3: Tax & Service -->
            <div class="card" id="chargesCard">
                <div class="step-indicator">
                    <span class="step-badge" id="step3Badge">3</span>
                    <span>Tax & Service</span>
                </div>
                <div>
                    <label class="label-small">Service Charge</label>
                    <div class="input-group" style="margin-bottom: 1rem;">
                        <input type="number" id="serviceAmount" value="0" />
                        <button class="btn btn-small" onclick="editField('service')">Edit</button>
                    </div>
                </div>
                <div>
                    <label class="label-small">Tax</label>
                    <div class="input-group">
                        <input type="number" id="taxAmount" value="0" />
                        <button class="btn btn-small" onclick="editField('tax')">Edit</button>
                    </div>
                </div>
            </div>

            <!-- Step 4: Bearer -->
            <div class="card" id="bearerCard">
                <div class="step-indicator">
                    <span class="step-badge" id="step4Badge">4</span>
                    <span>Who Paid?</span>
                </div>
                <div class="toggle-buttons" id="bearerButtons"></div>
            </div>

            <!-- Calculate -->
            <button class="btn btn-full" style="background: linear-gradient(to right, #9333ea, #ec4899, #3b82f6); font-size: 1.125rem;" onclick="calculate()">
                💸 Calculate
            </button>
        </div>

        <!-- Results View -->
        <div id="resultView" class="hidden">
            <div class="card">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem; margin: 0;">📋 Bill Summary</h2>
                </div>

                <div id="resultPeople" style="margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #e5e7eb;"></div>

                <div class="settlement-box">
                    <div class="settlement-title">✅ SETTLEMENT</div>
                    <div id="resultSettlement"></div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary btn-full" onclick="backToEdit()">✏️ Edit</button>
                    <button class="btn btn-blue btn-full" onclick="screenshot()">📱 Save to Gallery</button>
                    <button class="btn btn-green btn-full" onclick="shareWhatsApp()">💬 Share to WhatsApp</button>
                </div>
            </div>
        </div>

        <!-- Edit Item Modal -->
        <div id="editItemModal" class="modal hidden">
            <div class="modal-content">
                <h2 style="margin-bottom: 1rem;">Edit Item</h2>
                <input type="text" id="editItemName" placeholder="item name..." style="width: 100%; margin-bottom: 1rem;" />
                <input type="number" id="editItemPrice" placeholder="price..." style="width: 100%; margin-bottom: 1rem;" />
                
                <div style="margin-bottom: 1.5rem;">
                    <span class="label-small">Assign to:</span>
                    <div class="toggle-buttons" id="editItemButtons"></div>
                </div>

                <div class="button-group">
                    <button class="btn btn-full" onclick="saveEditedItem()">Save Changes</button>
                    <button class="btn btn-secondary btn-full" onclick="closeEditModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            apiKey: localStorage.getItem('splitbill_api_key') || '',
            currency: 'IDR',
            currencySymbol: 'Rp',
            people: [],
            items: [],
            serviceAmount: 0,
            taxAmount: 0,
            bearer: '',
            newItemAssigned: [],
            editingItemIdx: null
        };

        function setApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('Please enter your API key');
                return;
            }
            if (!key.startsWith('sk-ant-')) {
                alert('Invalid API key format. Must start with sk-ant-');
                return;
            }
            state.apiKey = key;
            localStorage.setItem('splitbill_api_key', key);
            document.getElementById('setupView').classList.add('hidden');
            document.getElementById('inputView').classList.remove('hidden');
            document.getElementById('resetKeyBtn').style.display = 'inline-block';
            updateUI();
        }

        function resetApiKey() {
            if (confirm('Clear your API key?')) {
                state.apiKey = '';
                localStorage.removeItem('splitbill_api_key');
                document.getElementById('setupView').classList.remove('hidden');
                document.getElementById('inputView').classList.add('hidden');
                document.getElementById('resultView').classList.add('hidden');
                document.getElementById('resetKeyBtn').style.display = 'none';
                document.getElementById('apiKeyInput').value = '';
            }
        }

        function updateValidation() {
            const hasPeople = state.people.length > 0;
            const hasItems = state.items.length > 0;
            const hasBearar = state.bearer !== '';

            // Step badges
            document.getElementById('step1Badge').className = `step-badge ${hasPeople ? 'complete' : 'incomplete'}`;
            document.getElementById('step1Badge').textContent = hasPeople ? '✓' : '1';
            
            document.getElementById('step2Badge').className = `step-badge ${hasItems ? 'complete' : 'incomplete'}`;
            document.getElementById('step2Badge').textContent = hasItems ? '✓' : '2';

            document.getElementById('step3Badge').className = `step-badge complete`;
            document.getElementById('step3Badge').textContent = '✓';

            document.getElementById('step4Badge').className = `step-badge ${hasBearar ? 'complete' : 'incomplete'}`;
            document.getElementById('step4Badge').textContent = hasBearar ? '✓' : '4';

            // Disable cards
            document.getElementById('itemsCard').classList.toggle('disabled-field', !hasPeople);
            document.getElementById('chargesCard').classList.toggle('disabled-field', !hasItems);
            document.getElementById('bearerCard').classList.toggle('disabled-field', !hasItems);
        }

        function updateUI() {
            updatePeopleList();
            updateAssignButtons();
            updateBearerButtons();
            updateItemsList();
            updateValidation();
        }

        function updatePeopleList() {
            const list = document.getElementById('peopleList');
            list.innerHTML = state.people.map(person => `
                <div class="pill">
                    ${person}
                    <button onclick="removePerson('${person}')">✕</button>
                </div>
            `).join('');
        }

        function updateAssignButtons() {
            const buttons = document.getElementById('assignButtons');
            buttons.innerHTML = state.people.map(person => `
                <button class="toggle-btn ${state.newItemAssigned.includes(person) ? 'active' : ''}" onclick="toggleAssign('${person}')">
                    ${person}
                </button>
            `).join('');
        }

        function updateBearerButtons() {
            const buttons = document.getElementById('bearerButtons');
            buttons.innerHTML = state.people.map(person => `
                <button class="toggle-btn ${state.bearer === person ? 'active' : ''}" onclick="setBearer('${person}')">
                    ${person}
                </button>
            `).join('');
        }

        function updateItemsList() {
            const list = document.getElementById('itemsList');
            list.innerHTML = state.items.map((item, idx) => `
                <div class="item-box">
                    <div class="item-header">
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${formatCurrency(item.price)}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="openEditModal(${idx})">✏️ Edit</button>
                            <button class="btn-delete" onclick="deleteItem(${idx})">🗑️</button>
                        </div>
                    </div>
                    <div class="item-tags">
                        ${item.assignedTo.map(person => `<span class="item-tag">${person}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function addPerson() {
            const input = document.getElementById('newPersonInput');
            const name = input.value.trim();
            if (name && !state.people.includes(name)) {
                state.people.push(name);
                input.value = '';
                updateUI();
            }
        }

        function removePerson(person) {
            state.people = state.people.filter(p => p !== person);
            if (state.bearer === person) state.bearer = '';
            state.items = state.items.map(item => ({
                ...item,
                assignedTo: item.assignedTo.filter(p => p !== person)
            }));
            updateUI();
        }

        function toggleAssign(person) {
            if (state.newItemAssigned.includes(person)) {
                state.newItemAssigned = state.newItemAssigned.filter(p => p !== person);
            } else {
                state.newItemAssigned.push(person);
            }
            updateAssignButtons();
        }

        function setBearer(person) {
            state.bearer = state.bearer === person ? '' : person;
            updateValidation();
            updateBearerButtons();
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);

            if (name && price > 0 && state.newItemAssigned.length > 0) {
                state.items.push({
                    name,
                    price,
                    assignedTo: [...state.newItemAssigned]
                });
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                state.newItemAssigned = [];
                updateUI();
            }
        }

        function deleteItem(idx) {
            state.items.splice(idx, 1);
            updateUI();
        }

        function openEditModal(idx) {
            state.editingItemIdx = idx;
            const item = state.items[idx];
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemPrice').value = item.price;
            state.newItemAssigned = [...item.assignedTo];
            updateEditButtons();
            document.getElementById('editItemModal').classList.remove('hidden');
        }

        function updateEditButtons() {
            const buttons = document.getElementById('editItemButtons');
            buttons.innerHTML = state.people.map(person => `
                <button class="toggle-btn ${state.newItemAssigned.includes(person) ? 'active' : ''}" onclick="toggleEditAssign('${person}')">
                    ${person}
                </button>
            `).join('');
        }

        function toggleEditAssign(person) {
            if (state.newItemAssigned.includes(person)) {
                state.newItemAssigned = state.newItemAssigned.filter(p => p !== person);
            } else {
                state.newItemAssigned.push(person);
            }
            updateEditButtons();
        }

        function saveEditedItem() {
            const name = document.getElementById('editItemName').value.trim();
            const price = parseFloat(document.getElementById('editItemPrice').value);

            if (name && price > 0 && state.newItemAssigned.length > 0) {
                state.items[state.editingItemIdx] = {
                    name,
                    price,
                    assignedTo: [...state.newItemAssigned]
                };
                state.editingItemIdx = null;
                state.newItemAssigned = [];
                updateUI();
                closeEditModal();
            }
        }

        function closeEditModal() {
            document.getElementById('editItemModal').classList.add('hidden');
        }

        function formatCurrency(amount) {
            if (state.currency === 'IDR') {
                return `Rp${Math.round(amount).toLocaleString('id-ID')}`;
            }
            return `${state.currencySymbol}${amount.toFixed(2)}`;
        }

        function editField(field) {
            if (field === 'service') {
                const val = prompt('Enter service charge:', state.serviceAmount);
                if (val !== null) state.serviceAmount = parseFloat(val) || 0;
            } else if (field === 'tax') {
                const val = prompt('Enter tax amount:', state.taxAmount);
                if (val !== null) state.taxAmount = parseFloat(val) || 0;
            }
            document.getElementById('serviceAmount').value = state.serviceAmount;
            document.getElementById('taxAmount').value = state.taxAmount;
        }

        function showOCRStatus(type, message, itemCount = 0) {
            const statusEl = document.getElementById('ocrStatus');
            statusEl.className = `ocr-status ${type}`;
            
            if (type === 'success') {
                statusEl.innerHTML = `✅ ${message}<br><span style="font-size: 0.8rem;">Found ${itemCount} item${itemCount !== 1 ? 's' : ''}</span>`;
            } else if (type === 'error') {
                statusEl.innerHTML = `❌ ${message}`;
            } else {
                statusEl.innerHTML = `⏳ ${message}`;
            }
            
            statusEl.classList.remove('hidden');
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const maxSize = 1200;
                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    
                    // Get base64 without data URI prefix
                    canvas.toBlob(blob => {
                        const reader2 = new FileReader();
                        reader2.onload = (e2) => {
                            // Extract just the base64 part
                            const base64str = e2.target.result.split(',')[1];
                            callback(base64str);
                        };
                        reader2.readAsDataURL(blob);
                    }, 'image/jpeg', 0.7);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleVisionOCR(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Check if API key exists
            if (!state.apiKey) {
                alert('Please set your API key first in settings');
                return;
            }

            const button = document.getElementById('ocrButton');
            button.disabled = true;
            
            showOCRStatus('pending', 'Scanning receipt...');

            compressImage(file, async (compressedBase64) => {
                try {
                    console.log('Sending to API...');
                    const response = await fetch('/api/vision', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            imageBase64: compressedBase64,
                            apiKey: state.apiKey
                        })
                    });

                    console.log('Response status:', response.status);

                    if (!response.ok) {
                        const error = await response.json();
                        console.error('API Error:', error);
                        showOCRStatus('error', error.error || 'Failed to scan receipt');
                        throw new Error(error.error);
                    }

                    const data = await response.json();
                    console.log('OCR Result:', data);
                    
                    if (!data.success || !data.items) {
                        showOCRStatus('error', 'Invalid response from API');
                        return;
                    }

                    const items = data.items;
                    if (items.length === 0) {
                        showOCRStatus('error', 'No items found on receipt');
                    } else {
                        items.forEach(item => {
                            state.items.push({
                                name: item.name,
                                price: item.price,
                                assignedTo: []
                            });
                        });

                        if (data.tax) state.taxAmount = data.tax;
                        if (data.service) state.serviceAmount = data.service;

                        document.getElementById('taxAmount').value = state.taxAmount;
                        document.getElementById('serviceAmount').value = state.serviceAmount;

                        updateUI();
                        showOCRStatus('success', 'Receipt scanned successfully!', items.length);
                    }
                } catch (error) {
                    console.error('Full error:', error);
                    showOCRStatus('error', error.message || 'Failed to process receipt');
                } finally {
                    button.disabled = false;
                }
            });
        }

        function calculate() {
            if (!state.bearer || state.items.length === 0) {
                alert('Complete all steps first');
                return;
            }

            const personSubtotals = {};
            const personOrders = {};
            const personService = {};
            const personTax = {};
            const personTotals = {};

            state.people.forEach(p => {
                personSubtotals[p] = 0;
                personOrders[p] = [];
                personService[p] = 0;
                personTax[p] = 0;
                personTotals[p] = 0;
            });

            state.items.forEach(item => {
                if (item.assignedTo.length > 0) {
                    const perPerson = item.price / item.assignedTo.length;
                    item.assignedTo.forEach(person => {
                        personSubtotals[person] += perPerson;
                        personOrders[person].push(item.name);
                    });
                }
            });

            const totalItems = Object.values(personSubtotals).reduce((a, b) => a + b, 0);

            Object.keys(personSubtotals).forEach(person => {
                const proportion = totalItems > 0 ? personSubtotals[person] / totalItems : 0;
                personService[person] = state.serviceAmount * proportion;
                personTax[person] = state.taxAmount * proportion;
                personTotals[person] = personSubtotals[person] + personService[person] + personTax[person];
            });

            const settlement = [];
            state.people.forEach(person => {
                if (person !== state.bearer && personTotals[person] > 0) {
                    settlement.push({ from: person, to: state.bearer, amount: personTotals[person] });
                }
            });

            showResults(personSubtotals, personService, personTax, personTotals, personOrders, settlement);
        }

        function showResults(subtotals, services, taxes, totals, orders, settlement) {
            const totalSum = Object.values(totals).reduce((a, b) => a + b, 0);

            const peopleHtml = state.people.map(person => `
                <div class="result-card">
                    <div class="result-person-name">${person.toUpperCase()}</div>
                    <div class="result-order">Order: ${orders[person].join(', ') || 'nothing'}</div>
                    <div style="font-size: 0.875rem; color: #4b5563; line-height: 1.6; margin-top: 0.5rem;">
                        <div>Subtotal: ${formatCurrency(subtotals[person])}</div>
                        <div>Service: ${formatCurrency(services[person])}</div>
                        <div>Tax: ${formatCurrency(taxes[person])}</div>
                    </div>
                    <div class="result-total" style="margin-top: 0.75rem;">Total: ${formatCurrency(totals[person])}</div>
                </div>
            `).join('');

            const settlementHtml = settlement.map(s => `
                <div class="settlement-item">
                    <strong>${s.from}</strong> owes <strong>${s.to}</strong>: <span style="color: #10b981; font-weight: 700;">${formatCurrency(s.amount)}</span>
                </div>
            `).join('');

            document.getElementById('resultPeople').innerHTML = peopleHtml;
            document.getElementById('resultSettlement').innerHTML = settlementHtml + `
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(16, 185, 129, 0.3); text-align: center;">
                    <div style="font-size: 0.875rem; color: #4b5563; margin-bottom: 0.5rem;">Total Bill:</div>
                    <div style="font-size: 1.25rem; font-weight: 700; color: #10b981;">${formatCurrency(totalSum)}</div>
                </div>
            `;
            document.getElementById('inputView').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');
        }

        function backToEdit() {
            document.getElementById('inputView').classList.remove('hidden');
            document.getElementById('resultView').classList.add('hidden');
        }

        function screenshot() {
            alert('📱 Use: hold power + volume up');
        }

        function shareWhatsApp() {
            const resultView = document.getElementById('resultView');
            const text = resultView.innerText;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            if (!state.apiKey) {
                document.getElementById('setupView').classList.remove('hidden');
                document.getElementById('resetKeyBtn').style.display = 'none';
            } else {
                document.getElementById('inputView').classList.remove('hidden');
                document.getElementById('resetKeyBtn').style.display = 'inline-block';
                updateUI();
            }
            // Ensure modal is hidden on load
            document.getElementById('editItemModal').classList.add('hidden');
        });

        document.getElementById('newPersonInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPerson();
        });

        document.getElementById('serviceAmount').addEventListener('change', (e) => {
            state.serviceAmount = parseFloat(e.target.value) || 0;
        });

        document.getElementById('taxAmount').addEventListener('change', (e) => {
            state.taxAmount = parseFloat(e.target.value) || 0;
        });
    </script>
</body>
